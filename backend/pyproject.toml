[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitauto-ai-backend"
version = "0.1.0"
description = "Secure FastAPI backend for GitAuto AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "itsdangerous>=2.2,<3.0",
  "cryptography>=43,<46",
  "alembic>=1.14,<2.0",
  "openai>=1.68,<2.0",
  "celery>=5.3,<6.0",
  "redis>=5.0,<7.0",
  "pymysql>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
